#for db connection
database:
  host: localhost
  port: 5432
  dbname: fraud
  user: postgres

#for data
data:
  csv_path: data/paysim.csv
  monitored_types: [TRANSFER, CASH_OUT]

#time split for training and testing
split: 
  train_end_step: 288 #from day 1-12
  valid_end_step: 360 #from day 13-15

#data quality checks
quality:
  valid_types: [CASH_IN, CASH_OUT, DEBIT, PAYMENT, TRANSFER]
  min_step: 1
  max_step: 743
  balance_tolerance: 1.0

#rule scenarios: one SQL file per rule, thresholds as parameters
rules:
  R01_ACCOUNT_DRAIN:
    enabled: true
    file: sql/rules/R01_account_drain.sql
    params: {drain_ratio: 0.95, min_amount: 10000}
  R02_EMPTY_DEST_HIGH_VALUE:
    enabled: true
    file: sql/rules/R02_empty_dest_high_value.sql
    params: {min_amount: 100000}

#model setting
model:
  alert_budget_per_day: 200
  drop_features: []

#alert list for investigators, only rules worth their time
report:
  queue_rules: [R02_EMPTY_DEST_HIGH_VALUE]

#control
controls: {}